<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid
    </title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            
            
           div {
            justify-content: center;
            display: grid;
            grid-gap: 0.5rem;
            grid-template-columns: 110px 110px 110px;
            grid-template-rows: 110px 110px 110px;
            grid-template-areas: "a b c"
                                "d b e"
                                "f f g";
           
           img {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            border: 1px solid white;
            object-fit: cover;
            transition: 0.5s ease;

            &:hover {
                transform: scale(1.1);
            }
            
           }
           .img1 {
            grid-area: a;
            
            
           }
           .img2 {
            grid-area: b;
            
           }
           .img3 {
            grid-area: c;
            
           }
           .img4 {
            grid-area: d;
            
           }
           .img5 {
            grid-area: f;
            
           }
           .img6 {
            grid-area: e;
            
           }
           .img7 {
            grid-area: g;
            
           }
        }

        div.fotos {
            justify-content: center;
            display: grid;
            grid-gap: 0.5rem;
            grid-template-columns: 80px 80px 80px 80px;
            grid-template-rows: 80px 80px 80px;
            grid-template-areas: "one one two three"
                                "one one four four"
                                "five six four four";

            img {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            border: 1px solid white;
            object-fit: cover;
            transition: 0.5s ease;
            }

            .foto1 {
                grid-area: one;
            }
            .foto2 {
                grid-area: two;
            }
            .foto3 {
                grid-area: three;
            }
            .foto4 {
                grid-area: four;
            }
            .foto5 {
                grid-area: five;
            }
            .foto6 {
                grid-area: six;
            }
        }
    }

    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">

            </path>
        </svg>
        </a>
    </nav>
<main>
    <header class="mmenu internal">
        <h1>45-Challenge Grid
        </h1>
        <img src="../src/images/logo-css.png" alt="Css">
        <h3>Description</h3>
    </header>
    <section>
        <h3 class="subtitle">Sakamoto Days</h3>
            <div class="imagenes">
                <img src="imgs/imagen1.jpg" alt="" class="img1">
                <img src="imgs/imagen2.jpg" alt="" class="img2">
                <img src="imgs/imagen3.jpg" alt="" class="img3">
                <img src="imgs/imagen4.jpg" alt="" class="img4">
                <img src="imgs/imagen5.jpg" alt="" class="img5">
                <img src="imgs/imagen6.jpg" alt="" class="img6">
                <img src="imgs/imagen7.jpg" alt="" class="img7">
               
            </div>
    </section>
     <section>
        <h3 class="subtitle">Solo Leveling</h3>
        <div class="fotos">
                <img src="imgs/foto1.jpg" alt="" class="foto1">
                <img src="imgs/foto2.jpg" alt="" class="foto2">
                <img src="imgs/foto3.jpg" alt="" class="foto3">
                <img src="imgs/foto4.jpg" alt="" class="foto4">
                <img src="imgs/foto5.jpg" alt="" class="foto5">
                <img src="imgs/foto6.jpg" alt="" class="foto6">
               
            </div>
    </section>
    
    
</main>    
</body>
</html>
