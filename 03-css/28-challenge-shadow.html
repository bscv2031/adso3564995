<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>28-Challenge Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
        figure.frame {
            outline: 20px solid #fff;
            background: linear-gradient(to top, #663399, #dbb6ff);
            height: calc(41 * 20px); /* Y:29 */
            width:  calc(37 * 20px); /* X:29 */
            margin: 2rem auto;
            zoom: 0.45;
            transition: all 0.2s ease-in;
            &:hover {
                transform: scale(1.6);
            }
        }
        div.squares {
            background: url(imgs/square.png);
            /* filter: invert(100%); */
            opacity: 0.5;
            z-index: 2;
            margin-top: -20px;
            height: calc(41 * 20px);
            
        }
