<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Antique&display=swap" rel="stylesheet">
<style>
  :root {
    --noche: #14123a;
    --noche-2: #2a1f5c;
    --haori: #b3262e;
    --haori-oscuro: #6e1119;
    --shikon: #e58bff;
    --pergamino: #f5e8d0;
    --oro: #e0aa48;
    --tinta: #3a2230;
    --titulo: "Zen Antique", "Shippori Mincho", "Yu Mincho", Georgia, serif;
    --texto: "Shippori Mincho", "Yu Mincho", Georgia, "Times New Roman", serif;

    /* Ancho de cada hoja (alto = ancho x 1.5) */
    --w: min(46vw, 54vh, 360px);
  }
  @media (orientation: portrait) {
    :root { --w: min(64vw, 30vh, 330px); }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    overflow: hidden;
    display: grid;
    place-items: center;
    font-family: var(--texto);
    color: var(--tinta);
    background:
      radial-gradient(ellipse at 50% 0%, var(--noche-2) 0%, transparent 60%),
      linear-gradient(180deg, var(--noche) 0%, #0b0a24 100%);
    -webkit-tap-highlight-color: transparent;
  }

  .luna {
    position: fixed; top: 5vh; right: 8vw;
    width: 80px; height: 80px; border-radius: 50%;
    box-shadow: 13px 0 0 0 #fff4d6, 13px 0 40px 4px rgba(255, 244, 214, .3);
    transform: rotate(-20deg); opacity: .85;
  }
  .estrellas { position: fixed; inset: 0; pointer-events: none; }
  .estrellas i { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; }

  /* Pétalos de sakura */
  #petalos { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .petalo {
    position: absolute; top: -30px;
    background: radial-gradient(circle at 30% 30%, #ffe3ef, #f9a8c7);
    border-radius: 80% 0 80% 0; opacity: .85;
    animation: caer linear forwards;
  }
  @keyframes caer {
    0%   { transform: translate3d(0, -30px, 0) rotate(0deg); }
    50%  { transform: translate3d(var(--vaiven), 55vh, 0) rotate(180deg); }
    100% { transform: translate3d(calc(var(--vaiven) * -0.4), 112vh, 0) rotate(380deg); }
  }

  /* ====== ESCENA ====== */
  .escena {
    position: relative;
    perspective: 1800px;
    transition: transform 1.2s cubic-bezier(.5, 0, .2, 1);
  }
  .escena.abierta { transform: translateX(50%); }
  @media (orientation: portrait) {
    .escena.abierta { transform: translateY(50%); }
  }

  .tarjeta {
    position: relative;
    width: var(--w);
    height: calc(var(--w) * 1.5);
    cursor: pointer;
    transform-style: preserve-3d;
    outline: none;
  }
  .tarjeta:focus-visible { outline: 3px solid var(--shikon); outline-offset: 8px; }

  svg.arte { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ====== HOJA INTERIOR (mensaje) ====== */
  .interior {
    position: absolute; inset: 0;
    border-radius: 4px 10px 10px 4px;
    padding: 5% 7% 4%;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(229, 139, 255, .22), transparent 65%),
      linear-gradient(135deg, #fbf1dd, var(--pergamino));
    box-shadow: 0 22px 55px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(224, 170, 72, .6);
  }
  .interior::before {
    content: ""; position: absolute; inset: 9px;
    border: 1px solid rgba(179, 38, 46, .45); border-radius: 3px; pointer-events: none;
  }
  .interior .cuentas-int { width: 86%; flex: none; }
  .interior .centro { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .interior .titulo {
    font-family: var(--titulo);
    font-size: calc(var(--w) * .085);
    color: var(--haori);
    margin-bottom: calc(var(--w) * .03);
  }
  .interior .mensaje {
    font-size: clamp(12.5px, calc(var(--w) * .05), 19px);
    line-height: 1.7; font-weight: 500; max-width: 28ch;
  }
  .interior .mensaje span { display: block; opacity: 0; transform: translateY(8px); }
  .escena.abierta .interior .mensaje span { animation: aparecer .9s ease forwards; }
  .escena.abierta .interior .mensaje span:nth-child(1) { animation-delay: 1.1s; }
  .escena.abierta .interior .mensaje span:nth-child(2) { animation-delay: 1.8s; }
  .escena.abierta .interior .mensaje span:nth-child(3) { animation-delay: 2.5s; }
  .escena.abierta .interior .mensaje span:nth-child(4) { animation-delay: 3.2s; }
  .escena.abierta .interior .mensaje span:nth-child(5) { animation-delay: 4.1s; }
  .interior .mensaje .extra { margin-top: .7em; color: var(--haori); font-style: italic; }
  @keyframes aparecer { to { opacity: 1; transform: none; } }

  .interior .pie { width: 80%; flex: none; opacity: 0; }
  .escena.abierta .interior .pie { animation: aparecer 1s ease 4.9s forwards; }

  /* Tajo de viento que cruza la hoja al abrir */
  .tajo-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
  .tajo {
    position: absolute; left: -20%; top: 48%;
    width: 140%; height: 3px;
    background: linear-gradient(90deg, transparent, #fff 35%, var(--shikon) 65%, transparent);
    box-shadow: 0 0 14px 3px rgba(229, 139, 255, .8);
    transform: rotate(-33deg) translateX(-110%);
    opacity: 0;
  }
  .escena.abierta .tajo { animation: tajo 1s cubic-bezier(.2, .7, .2, 1) .75s forwards; }
  @keyframes tajo {
    0%   { transform: rotate(-33deg) translateX(-110%); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: rotate(-33deg) translateX(110%); opacity: 0; }
  }

  /* ====== PORTADA ====== */
  .portada {
    position: absolute; inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(.5, 0, .2, 1);
  }
  .escena.abierta .portada { transform: rotateY(-180deg); }
  @media (orientation: portrait) {
    .portada { transform-origin: center top; }
    .escena.abierta .portada { transform: rotateX(180deg); }
  }

  .cara {
    position: absolute; inset: 0;
    border-radius: 4px 10px 10px 4px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* Frente: haori de la rata de fuego */
  .frente {
    background: var(--haori);
    box-shadow: 0 22px 55px rgba(0, 0, 0, .65),
                inset 0 0 0 2px rgba(224, 170, 72, .85),
                inset 0 0 0 7px rgba(110, 17, 25, .9),
                inset 0 0 0 8px rgba(224, 170, 72, .5);
  }
  .espada { filter: drop-shadow(0 0 7px rgba(255, 205, 245, .85)); }
  .orbe { animation: latir 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes latir {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 6px var(--shikon)) drop-shadow(0 0 14px rgba(229,139,255,.6)); }
    50%      { transform: scale(1.1);  filter: drop-shadow(0 0 12px var(--shikon)) drop-shadow(0 0 28px rgba(229,139,255,1)); }
  }
  .kanji {
    position: absolute; left: 9%; top: 25%;
    writing-mode: vertical-rl;
    font-family: var(--titulo);
    font-size: calc(var(--w) * .085);
    letter-spacing: .12em;
    color: var(--oro);
    text-shadow: 0 1px 0 var(--haori-oscuro), 0 0 10px rgba(0, 0, 0, .35);
  }
  .textos {
    position: absolute; inset: auto 0 6% 0;
    display: flex; flex-direction: column; align-items: center;
    color: #fff1dd; text-align: center;
  }
  .textos .para { font-size: calc(var(--w) * .05); letter-spacing: .18em; opacity: .95; }
  .textos .nombre {
    font-family: var(--titulo);
    font-size: calc(var(--w) * .21);
    line-height: 1.05; color: #fff;
    text-shadow: 0 3px 0 var(--haori-oscuro), 0 0 24px rgba(255, 214, 245, .6);
  }
  .textos .toca {
    margin-top: calc(var(--w) * .05);
    font-size: calc(var(--w) * .04);
    animation: parpadeo 2.4s ease-in-out infinite;
  }
  @keyframes parpadeo { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }

  /* Dorso de la portada: noche del Sengoku */
  .dorso {
    transform: rotateY(180deg);
    box-shadow: inset 0 0 0 1px rgba(224, 170, 72, .6);
    background: #0e0c33;
  }
  @media (orientation: portrait) { .dorso { transform: rotateX(180deg); } }

  .luci { animation: luci 3.2s ease-in-out infinite; }
  @keyframes luci { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  .flota { animation: flota 4s ease-in-out infinite; }
  @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

  @media (prefers-reduced-motion: reduce) {
    .petalo, .orbe, .textos .toca, .luci, .flota { animation: none; }
    .portada, .escena { transition-duration: .01s; }
    .escena.abierta .interior .mensaje span,
    .escena.abierta .interior .pie { animation-duration: .01s; animation-delay: 0s; }
    .tajo { display: none; }
  }
</style>
</head>
<body>

<!-- Definiciones compartidas de los SVG -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="beadG" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#c3a2ff"/><stop offset=".55" stop-color="#5d33a6"/><stop offset="1" stop-color="#2a1160"/>
    </radialGradient>
    <radialGradient id="orbG" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#ffd6f5"/>
      <stop offset=".6" stop-color="#e58bff"/><stop offset="1" stop-color="#7a2fc0"/>
    </radialGradient>
    <linearGradient id="bladeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4eefc"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#cdbbea"/>
    </linearGradient>
    <linearGradient id="cieloG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a2e"/><stop offset=".6" stop-color="#2d2166"/><stop offset="1" stop-color="#6b3a86"/>
    </linearGradient>
    <linearGradient id="luzPozo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd6f5" stop-opacity=".7"/><stop offset="1" stop-color="#b9a0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tela" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="none"/><rect width="7" height=".8" fill="#000" opacity=".12"/><rect width=".8" height="7" fill="#fff" opacity=".05"/>
    </pattern>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
</svg>

<div class="luna" aria-hidden="true"></div>
<div class="estrellas" id="estrellas" aria-hidden="true"></div>
<div id="petalos" aria-hidden="true"></div>

<main class="escena" id="escena">
  <div class="tarjeta" id="tarjeta" role="button" tabindex="0" aria-expanded="false" aria-label="Abrir la tarjeta para Aura">

    <!-- HOJA INTERIOR -->
    <section class="interior">
      <svg class="cuentas-int" viewBox="0 0 300 78" aria-hidden="true"><g id="cuentasInt"></g></svg>

      <div class="centro">
        <h1 class="titulo">Para Aura</h1>
        <p class="mensaje">
          <span>Eres la mujer más fuerte y espectacular que conozco,</span>
          <span>no te rindas, mucho ánimo, siempre puedes con todo</span>
          <span>y llegarán días mejores,</span>
          <span>llegarán los días que te mereces.</span>
          <span class="extra">Espero poder ver esos ojitos hermosos otra vez</span>
        </p>
      </div>

      <!-- Perla de Shikon entre dos flores de sakura -->
      <svg class="pie" viewBox="0 0 300 64" aria-hidden="true">
        <path d="M24 32 H118 M182 32 H276" stroke="#b3262e" stroke-opacity=".5" stroke-width="1"/>
        <g fill="#f9a8c7" stroke="#b3262e" stroke-width=".8">
          <g transform="translate(16 32)"><path id="pt" d="M0 0 C-7 -5 -7 -13 0 -15 C7 -13 7 -5 0 0Z"/><use href="#pt" transform="rotate(72)"/><use href="#pt" transform="rotate(144)"/><use href="#pt" transform="rotate(216)"/><use href="#pt" transform="rotate(288)"/></g>
          <g transform="translate(284 32)"><use href="#pt"/><use href="#pt" transform="rotate(72)"/><use href="#pt" transform="rotate(144)"/><use href="#pt" transform="rotate(216)"/><use href="#pt" transform="rotate(288)"/></g>
        </g>
        <circle cx="150" cy="32" r="30" fill="#e58bff" opacity=".28" filter="url(#blur6)"/>
        <circle class="orbe" cx="150" cy="32" r="16" fill="url(#orbG)"/>
      </svg>

      <div class="tajo-wrap"><div class="tajo"></div></div>
    </section>

    <!-- PORTADA -->
    <div class="portada">

      <!-- Frente -->
      <div class="cara frente">
        <svg class="arte" viewBox="0 0 300 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="300" height="450" fill="url(#tela)"/>
          <rect width="300" height="450" fill="#000" opacity=".12"/>
          <ellipse cx="150" cy="230" rx="190" ry="210" fill="#e0314a" opacity=".25"/>

          <!-- Collar de cuentas con colmillos -->
          <g id="cuentasFrente"></g>

          <!-- Colmillo de Acero (espada transformada) -->
          <g transform="translate(92 272) rotate(42) scale(1.15)">
            <g class="espada">
              <path d="M0,-205 C16,-150 34,-95 30,-24 L-24,-24 C-22,-90 -14,-150 0,-205 Z" fill="url(#bladeG)" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
              <path d="M5,-172 C13,-122 15,-72 13,-30" fill="none" stroke="#7b55b8" stroke-opacity=".35" stroke-width="2"/>
            </g>
            <rect x="-32" y="-26" width="64" height="14" rx="6" fill="#e0aa48" stroke="#6e1119" stroke-width="1.5"/>
            <rect x="-8" y="-12" width="16" height="62" fill="#2b1a33"/>
            <path d="M-8,-4 L8,4 M-8,10 L8,18 M-8,24 L8,32 M-8,38 L8,46" stroke="#e0aa48" stroke-width="1.6"/>
            <circle cx="0" cy="55" r="8" fill="#e0aa48" stroke="#6e1119" stroke-width="1.2"/>
          </g>

          <!-- Perla de Shikon -->
          <circle cx="222" cy="238" r="38" fill="#e58bff" opacity=".35" filter="url(#blur6)"/>
          <circle class="orbe" cx="222" cy="238" r="20" fill="url(#orbG)"/>
        </svg>

        <div class="kanji" aria-hidden="true">犬夜叉</div>

        <div class="textos">
          <div class="para">Para</div>
          <div class="nombre">Aura</div>
          <div class="toca">toca para abrir</div>
        </div>
      </div>

      <!-- Dorso: la noche, el Árbol Sagrado y el Pozo Devorahuesos -->
      <div class="cara dorso" aria-hidden="true">
        <svg class="arte" viewBox="0 0 300 450" preserveAspectRatio="xMidYMid slice">
          <rect width="300" height="450" fill="url(#cieloG)"/>
          <g fill="#fff" opacity=".8">
            <circle cx="30" cy="40" r="1.2"/><circle cx="70" cy="22" r="1"/><circle cx="110" cy="58" r="1.3"/>
            <circle cx="150" cy="25" r="1"/><circle cx="275" cy="150" r="1.2"/><circle cx="20" cy="130" r="1"/>
            <circle cx="95" cy="110" r="1"/><circle cx="260" cy="40" r="1.2"/><circle cx="170" cy="75" r="1"/>
          </g>

          <!-- Luna -->
          <circle cx="222" cy="92" r="62" fill="#fff4d6" opacity=".2" filter="url(#blur6)"/>
          <circle cx="222" cy="92" r="38" fill="#fff4d6"/>
          <circle cx="210" cy="84" r="7" fill="#eadcb6" opacity=".55"/>
          <circle cx="234" cy="104" r="5" fill="#eadcb6" opacity=".5"/>

          <!-- Árbol Sagrado -->
          <g fill="none" stroke="#1d1236" stroke-linecap="round">
            <path d="M144,295 C120,260 90,245 52,236" stroke-width="9"/>
            <path d="M150,290 C172,250 212,240 252,224" stroke-width="9"/>
            <path d="M142,300 C130,270 124,230 108,192" stroke-width="7"/>
            <path d="M152,292 C160,260 166,222 182,184" stroke-width="7"/>
            <path d="M147,292 C152,240 140,200 146,150" stroke-width="8"/>
          </g>
          <path d="M126,430 C136,380 134,330 130,288 L162,288 C158,330 162,380 176,430 Z" fill="#1d1236"/>
          <g id="flores"></g>

          <!-- Colinas -->
          <path d="M0,415 Q70,392 150,410 T300,402 L300,450 L0,450 Z" fill="#0b0820"/>

          <!-- Pozo -->
          <path d="M38,398 L82,398 L112,236 L8,236 Z" fill="url(#luzPozo)"/>
          <g transform="translate(34 396)">
            <rect x="0" y="6" width="56" height="30" fill="#2b1c3f"/>
            <path d="M14,6 V36 M28,6 V36 M42,6 V36" stroke="#43305e" stroke-width="1.5"/>
            <ellipse cx="28" cy="6" rx="28" ry="7" fill="#e9c8ff" stroke="#43305e" stroke-width="2"/>
          </g>
          <path d="M0,436 Q100,420 200,436 T300,430 L300,450 L0,450 Z" fill="#06051a"/>

          <!-- Luciérnagas -->
          <g fill="#fff3a8">
            <circle class="luci" cx="190" cy="360" r="2" style="animation-delay:-.5s"/>
            <circle class="luci" cx="215" cy="330" r="1.8" style="animation-delay:-1.4s"/>
            <circle class="luci" cx="100" cy="340" r="2" style="animation-delay:-2.2s"/>
            <circle class="luci" cx="245" cy="380" r="1.6" style="animation-delay:-.9s"/>
            <circle class="luci" cx="70" cy="300" r="1.8" style="animation-delay:-1.9s"/>
          </g>

          <!-- Fragmento de la Perla flotando -->
          <g transform="translate(236 292)">
            <g class="flota">
              <circle r="22" fill="#e58bff" opacity=".4" filter="url(#blur6)"/>
              <polygon points="0,-14 10,-3 7,13 -5,15 -10,0" fill="url(#orbG)" stroke="#fff" stroke-opacity=".6"/>
            </g>
          </g>
        </svg>
      </div>
    </div>

  </div>
</main>

<script>
  const escena = document.getElementById('escena');
  const tarjeta = document.getElementById('tarjeta');
  const petalos = document.getElementById('petalos');
  const estrellas = document.getElementById('estrellas');
  const reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // Collar de cuentas moradas con colmillos (como el de Inuyasha)
  function cuentas(g, P0, C, P1, n, r) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      pts.push({
        i, t,
        x: u*u*P0[0] + 2*u*t*C[0] + t*t*P1[0],
        y: u*u*P0[1] + 2*u*t*C[1] + t*t*P1[1]
      });
    }
    // colmillos primero (quedan detrás de las cuentas)
    pts.forEach(p => {
      if (Math.abs(p.t - 0.5) < 0.3 && p.i % 2 === 0) {
        el('path', {
          d: `M${p.x - r*.75},${p.y + r*.4} L${p.x + r*.75},${p.y + r*.4} L${p.x},${p.y + r*3.2} Z`,
          fill: '#fff5e0', stroke: '#cdbb9c', 'stroke-width': .6
        }, g);
      }
    });
    pts.forEach(p => {
      el('circle', { cx: p.x, cy: p.y, r, fill: 'url(#beadG)', stroke: '#1d0b45', 'stroke-width': .6 }, g);
    });
  }
  cuentas(document.getElementById('cuentasFrente'), [30, 34], [150, 150], [270, 34], 17, 8.5);
  cuentas(document.getElementById('cuentasInt'),    [30, 10], [150, 94],  [270, 10], 17, 6.5);

  // Flores de sakura del Árbol Sagrado
  const flores = document.getElementById('flores');
  [[52,236,24],[84,222,20],[108,192,24],[182,184,24],[216,226,20],[252,224,24],[146,148,30],[120,160,18],[176,150,18]]
    .forEach(([x, y, s]) => {
      for (let k = 0; k < 6; k++) {
        el('circle', {
          cx: x + (Math.random() - .5) * s, cy: y + (Math.random() - .5) * s,
          r: s * (.45 + Math.random() * .3),
          fill: k % 3 === 0 ? '#ffd1e3' : '#f6a6c9', opacity: .88
        }, flores);
      }
    });

  // Estrellas de fondo
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
    estrellas.appendChild(s);
  }

  // Pétalos cayendo
  function crearPetalo() {
    const p = document.createElement('div');
    p.className = 'petalo';
    const tam = 8 + Math.random() * 10;
    p.style.width = tam + 'px';
    p.style.height = tam * 0.8 + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--vaiven', (Math.random() * 160 - 80) + 'px');
    const dur = 7 + Math.random() * 7;
    p.style.animationDuration = dur + 's';
    petalos.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000);
  }
  if (!reducir) {
    setInterval(crearPetalo, 650);
    for (let i = 0; i < 8; i++) setTimeout(crearPetalo, i * 250);
  }

  // Abrir / cerrar al tocar
  function alternar() {
    const abierta = escena.classList.toggle('abierta');
    tarjeta.setAttribute('aria-expanded', abierta);
    tarjeta.setAttribute('aria-label', abierta ? 'Cerrar la tarjeta' : 'Abrir la tarjeta para Aura');
    if (abierta && !reducir) for (let i = 0; i < 24; i++) setTimeout(crearPetalo, i * 90);
  }
  tarjeta.addEventListener('click', alternar);
  tarjeta.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); }
  });
</script>
</body>
</html>
