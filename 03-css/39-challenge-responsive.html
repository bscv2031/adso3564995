<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papita y Cejas de choza</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ec;--bg2:#fff3d6;--page:#fffaf3;--ink:#5a3322;--accent:#e2547d;--accent2:#f5a623;--cover1:#9c5a35;--cover2:#6e3b20;--cover-ink:#fff1dc;--line:#f3bfcd;--shadow:rgba(110,40,60,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1420;--bg2:#2b2112;--page:#3a2630;--ink:#ffe8da;--accent:#ff7fa3;--accent2:#ffc15a;--cover1:#6d3d22;--cover2:#472411;--line:#6d4455;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1420;--bg2:#2b2112;--page:#3a2630;--ink:#ffe8da;--accent:#ff7fa3;--accent2:#ffc15a;--cover1:#6d3d22;--cover2:#472411;--line:#6d4455;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Fredoka,"Trebuchet MS",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;overflow:hidden;position:relative}
.float{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.float i{position:absolute;bottom:-40px;font-style:normal;animation:rise linear infinite;opacity:.5}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
.stage{perspective:1600px;width:min(94vw,460px);height:min(78vh,680px);position:relative;z-index:1}
.page{width:100%;height:100%;border-radius:8px 18px 18px 8px;padding:16px 16px 28px;display:flex;flex-direction:column;gap:8px;background:var(--page);border:3px solid var(--line);box-shadow:-8px 0 0 var(--line),0 16px 34px var(--shadow);transform-origin:left center;position:relative;overflow:hidden}
.page.cover{background:radial-gradient(circle at 30% 20%,var(--cover1),var(--cover2));color:var(--cover-ink);border:4px solid var(--accent2);box-shadow:-10px 0 0 rgba(0,0,0,.35),0 16px 34px var(--shadow);text-align:center}
.page.flip-next{animation:fn .6s ease}
.page.flip-prev{animation:fp .6s ease}
@keyframes fn{from{transform:rotateY(-75deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes fp{from{transform:rotateY(75deg);opacity:.2}to{transform:none;opacity:1}}
h1,h2{margin:0;text-align:center;font-family:Pacifico,"Brush Script MT",cursive;font-weight:400;line-height:1.15}
h1{font-size:clamp(26px,7.5vw,36px);text-shadow:2px 3px 0 rgba(0,0,0,.3)}
h2{font-size:clamp(28px,8vw,38px);color:var(--accent)}
.sub{text-align:center;font-size:14px;letter-spacing:.5px;opacity:.9}
.bob{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(5deg)}}
.frame{flex:1;min-height:0;position:relative;padding:14px;border-radius:22px;margin:10px 6px 6px}
.frame .ph{width:100%;height:100%;display:block;object-fit:cover;border-radius:12px}
.frame .c{position:absolute;font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
.c.tl{top:-16px;left:-12px}.c.tr{top:-16px;right:-12px}.c.bl{bottom:-16px;left:-12px}.c.br{bottom:-16px;right:-12px}
.c.tm{top:-22px;left:50%;transform:translateX(-50%);font-size:40px}.c.bm{bottom:-20px;left:50%;transform:translateX(-50%);font-size:36px}
.f-gold{background:linear-gradient(135deg,#ffe28a,#c98a12 45%,#ffe28a 60%,#a86f0c);box-shadow:0 8px 22px var(--shadow),inset 0 0 0 3px rgba(255,255,255,.45)}
.f-gold .ph{border:5px solid #fff3d0;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}
.f-wed{background:linear-gradient(160deg,#fff,#f6e9ff);border:4px double #d9a7e8;box-shadow:0 8px 22px var(--shadow),0 0 0 5px #fff,0 0 0 8px #e8c4f2}
.f-wed .ph{border:3px solid #d9a7e8;border-radius:50% 50% 14px 14px/28% 28% 14px 14px}
.f-rose{background:repeating-linear-gradient(45deg,#ff8fb0 0 12px,#ffc2d4 12px 24px);box-shadow:0 8px 22px var(--shadow);transform:rotate(-1deg)}
.f-rose .ph{border:6px solid #fff;box-shadow:0 0 0 3px #e2547d}
.f-ban{background:radial-gradient(circle,#ffe066 38%,transparent 40%) 0 0/26px 26px,#ffd23f;border-radius:26px;box-shadow:0 8px 22px var(--shadow),0 0 0 4px #fff7c2;transform:rotate(1deg)}
.f-ban .ph{border:6px solid #fff;box-shadow:0 0 0 3px #7a4a1d}
.num{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:13px;opacity:.7}
.nav{display:flex;align-items:center;gap:14px;z-index:1}
.nav button{font:inherit;font-weight:600;font-size:16px;padding:10px 20px;border-radius:999px;border:none;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.nav button:active{transform:translateY(3px);box-shadow:none}
.nav button:disabled{opacity:.35;cursor:default}
.nav .ind{min-width:60px;text-align:center;font-size:15px}
</style>
</head>

<div class="float" id="float"></div>
<div class="stage" id="stage"></div>
<div class="nav">
  <button id="prev" aria-label="Página anterior">← Atrás</button>
  <span class="ind" id="ind"></span>
  <button id="next" aria-label="Página siguiente">Siguiente →</button>
</div>

];
let cur=0;
const stage=document.getElementById('stage'),ind=document.getElementById('ind'),prev=document.getElementById('prev'),next=document.getElementById('next');
const fl=document.getElementById('float'),em=['💕','🍌','💗','🐵','🌸','🙈','💖'];
for(let k=0;k<16;k++){const i=document.createElement('i');i.textContent=em[k%em.length];i.style.left=(Math.random()*100)+'vw';i.style.fontSize=(18+Math.random()*22)+'px';i.style.animationDuration=(9+Math.random()*10)+'s';i.style.animationDelay=(-Math.random()*15)+'s';fl.appendChild(i)}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
function render(dir){
  const p=pages[cur],cover=p.type==='cover';
  const el=mk('div','page'+(cover?' cover':''));
  if(dir)el.classList.add(dir>0?'flip-next':'flip-prev');
  const fr=mk('div','frame '+p.frame);
  const im=mk('img','ph');im.src=p.img;im.alt=p.title;im.style.objectPosition=p.pos;fr.appendChild(im);
  ['tl','tr','bl','br','tm','bm'].forEach((k,n)=>fr.appendChild(mk('span','c '+k,p.c[n])));
  if(cover){const t=mk('h1');t.append(mk('span','bob',p.emoji+' '),p.title);el.append(t,mk('div','sub',p.sub),fr)}
  else{el.append(mk('h2','',p.title),mk('div','sub',p.sub),fr,mk('div','num','♥ '+cur+' ♥'))}
  stage.replaceChildren(el);
  ind.textContent=(cur+1)+' / '+pages.length;
  prev.disabled=cur===0;next.disabled=cur===pages.length-1;
}
function go(d){const n=cur+d;if(n<0||n>=pages.length)return;cur=n;render(d)}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
render();
</script>
