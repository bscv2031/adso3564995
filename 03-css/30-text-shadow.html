<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Text Shadowe</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt {
                font-size: 4rem;
                font-weight: 600;
                text-align: center;
                margin: 0;

                &.txt1 {
                    color: black;
                    text-shadow: 0 0 6px white;
                }
                &.txt2 {
                    color: black;
                    text-shadow: -4px -4px 4px white;
                }
                &.txt3 {
                    color: white;
                    text-shadow: 5px 5px 15px rgb(0, 200, 255),
                                 -5px -5px 15px rgb(251, 3, 234),
                                 0px 0px 20px white;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">

            </path>
        </svg>
        </a>
    </nav>
<main>
    <header class="mmenu internal">
        <h1>30-Text Shadow</h1>
        <img src="../src/images/logo-css.png" alt="Css">
        <h3>Property that adds shadow effects directly to text content, taking values for offset, blur radius, and color.</h3>
    </header>
    <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    
    
</main>    
</body>
</html>
